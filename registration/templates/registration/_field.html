<div class="field{% if f.errors %} has-error{% endif %}">
  {% if f.field.widget.input_type == "radio" %}<span class="label">{{ f.label }}{% if f.field.required %} <span class="req">*</span>{% endif %}</span>
  {% else %}<label for="{{ f.id_for_label }}">{{ f.label }}{% if f.field.required %} <span class="req">*</span>{% endif %}</label>{% endif %}
  {% if f.field.widget.input_type == "radio" %}<div class="radio-row">{% for r in f %}<label>{{ r.tag }} {{ r.choice_label }}</label>{% endfor %}</div>{% else %}{{ f }}{% endif %}
  {% if help %}<div class="help">{{ help }}</div>{% endif %}
  {{ f.errors }}
</div>
