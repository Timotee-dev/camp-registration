{% extends "registration/base.html" %}
{% block body %}
<nav class="topbar"><div class="topbar-inner">
  <a class="brand" href="{% url 'registration:dashboard' %}">⛺ {{ SITE_NAME }}</a>
  <a href="{% url 'registration:register' %}" target="_blank">Public form ↗</a>
  <a href="{% url 'admin:index' %}">Admin</a>
  <form method="post" action="{% url 'registration:logout' %}" style="margin:0">{% csrf_token %}<button class="linklike" style="color:#e9e4d6">Log out ({{ user.username }})</button></form>
</div></nav>
<main class="container">
  {% for m in messages %}<div class="notice notice-ok">{{ m }}</div>{% endfor %}
  {% block content %}{% endblock %}
</main>
{% endblock %}
